<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme - support chat demo (LiveKit)</title>
    <style>
      body { font-family: Georgia, serif; max-width: 720px; margin: 60px auto; padding: 0 20px; color: #333; }
      h1 { color: #b45309; }
    </style>
  </head>
  <body>
    <h1>Acme demo website</h1>
    <p>This page simulates a customer's site. Its own CSS must not affect the chat widget.</p>
    <script src="/widget.js"></script>
    <script>
      SupportChat.init({
        backendUrl: location.origin,
        authToken: null,
        // Optional: who is using the site. Remove any field you don't have; the backend fills in defaults
        // (Test User / testuser@test.com / +9876543210). Try ?name=Priya&email=priya@example.com&phone=%2B919812345678
        user: {
          name: new URLSearchParams(location.search).get("name") || undefined,
          email: new URLSearchParams(location.search).get("email") || undefined,
          phone: new URLSearchParams(location.search).get("phone") || undefined,
        },
        metadata: { plan: "demo", page: location.pathname },   // optional free-form facts for the AI and agents
      });
    </script>
  </body>
</html>
